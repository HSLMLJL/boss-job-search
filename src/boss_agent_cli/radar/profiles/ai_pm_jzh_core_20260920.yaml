name: ai_pm_jzh_core_20260920
# Current Jiangsu-Zhejiang-Shanghai application snapshot: one broad core phrase.
# Supplementary phrases are intentionally separate so their incremental value can
# be measured, rather than turning this delivery into a six-fold repeat scan.
queries:
  - AI产品经理

cities:
  - {name: 杭州, code: "101210100", tier: primary}
  - {name: 上海, code: "101020100", tier: secondary}
  - {name: 苏州, code: "101190400", tier: secondary}
  - {name: 南京, code: "101190100", tier: secondary}
  - {name: 宁波, code: "101210400", tier: optional}
  - {name: 无锡, code: "101190200", tier: optional}
  - {name: 常州, code: "101191100", tier: optional}

city_tiers:
  primary: 50
  secondary: 50
  optional: 50

# This is a circuit breaker, not a claim that fifty pages proves platform-wide
# recall.  A still-full terminal page remains coverage-unverified.
max_pages_per_query: 50
max_requests: 160
boss_search_transport: page_capture
delay_range: [20.0, 35.0]
max_retries: 0
retry_delay_seconds: 60.0
output_dir: jzh-core-20260920

job_exclusions:
  exclude_internships: true
  exclude_hourly_daily_pay: true
