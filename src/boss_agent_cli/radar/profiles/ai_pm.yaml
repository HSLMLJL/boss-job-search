name: ai_pm

# Primary cities: intended for the daily radar run. This profile only defines
# a search scope; it does not create or enable any scheduler.
queries:
  - AI产品经理
  - 人工智能产品经理
  - 大模型产品经理
  - AIGC产品经理
  - 智能体产品经理
  - Agent产品经理

cities:
  - {name: 北京, code: "101010100"}
  - {name: 上海, code: "101020100"}
  - {name: 深圳, code: "101280600"}
  - {name: 杭州, code: "101210100"}
  - {name: 广州, code: "101280100"}

# This is a circuit breaker only. A normal search ends earlier when BOSS
# reports no further results.
max_pages_per_query: 50
max_requests: 400
boss_search_transport: page_capture
delay_range: [20.0, 35.0]
max_retries: 0
retry_delay_seconds: 60.0
output_dir: output

# Keep the personal job radar focused on standard, non-intern openings.
job_exclusions:
  exclude_internships: true
  exclude_hourly_daily_pay: true
