name: ai_pm_daily_12city

queries:
  - AI产品经理

city_tiers:
  core:
    # High circuit breaker only; normal scans stop as soon as BOSS returns hasMore=false.
    max_pages_per_query: 50
  secondary:
    max_pages_per_query: 5

cities:
  - {name: 北京, code: "101010100", tier: core}
  - {name: 上海, code: "101020100", tier: core}
  - {name: 深圳, code: "101280600", tier: core}
  - {name: 杭州, code: "101210100", tier: core}
  - {name: 广州, code: "101280100", tier: core}
  - {name: 苏州, code: "101190400", tier: core}
  - {name: 南京, code: "101190100", tier: secondary}
  - {name: 成都, code: "101270100", tier: secondary}
  - {name: 武汉, code: "101200100", tier: secondary}
  - {name: 西安, code: "101110100", tier: secondary}
  - {name: 合肥, code: "101220100", tier: secondary}
  - {name: 长沙, code: "101250100", tier: secondary}

# Used only by a city without a tier or city-level override.
max_pages_per_query: 10
max_requests: 345
boss_search_transport: page_capture
delay_range: [20.0, 35.0]
max_retries: 0
retry_delay_seconds: 60.0
output_dir: daily-12city-output

job_exclusions:
  exclude_internships: true
  exclude_hourly_daily_pay: true
